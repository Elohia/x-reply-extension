<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>X 快速回复</title>
<style>
  body { width: 320px; margin: 0; padding: 12px 14px 14px; font: 13px/1.55 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; background: #15202b; color: #e7e9ea; }
  h1 { font-size: 14px; margin: 0 0 2px; }
  .sub { font-size: 11px; opacity: .6; margin-bottom: 10px; }
  .row { display: flex; align-items: center; gap: 8px; margin: 7px 0; }
  .row label { flex: 0 0 62px; opacity: .8; }
  input[type=text], input[type=password], select { flex: 1; min-width: 0; background: #0f1720; color: #e7e9ea; border: 1px solid #38444d; border-radius: 8px; padding: 4px 6px; font: inherit; }
  button { background: #1c2733; color: #e7e9ea; border: 1px solid #38444d; border-radius: 8px; padding: 4px 9px; font: inherit; cursor: pointer; }
  button.primary { background: #1d9bf0; border-color: #1d9bf0; color: #fff; }
  hr { border: 0; border-top: 1px solid #2f3b47; margin: 10px 0; }
  .stat { font-size: 12px; opacity: .8; }
  .note { font-size: 11px; opacity: .6; margin-top: 6px; }
  .ok { color: #6cc070; } .bad { color: #f7b267; }
  #msg { font-size: 11px; min-height: 14px; }
</style>
</head>
<body>
  <h1>X 快速回复</h1>
  <div class="sub">时间线点 R → AI 读这条 → 三条草稿 → 自己发</div>

  <div class="row"><label>启用</label><input type="checkbox" id="enabled"></div>
  <div class="row"><label>AI 生成</label><input type="checkbox" id="aiEnabled"><span class="note" style="margin:0">关闭则用本地模板</span></div>
  <div class="row"><label>自动弹出</label><input type="checkbox" id="autoOpen"><span class="note" style="margin:0">点推文「回复」时自动开面板</span></div>

  <hr>
  <div class="row"><label>API Key</label><input type="password" id="apiKey" placeholder="sk-…"></div>
  <div class="row"><label>Base URL</label><input type="text" id="apiBase" placeholder="https://api.deepseek.com"></div>
  <div class="row"><label>模型</label><input type="text" id="model" placeholder="deepseek-chat"></div>
  <div class="row"><button id="save" class="primary">保存</button><button id="test">测试连接</button></div>
  <div id="msg"></div>

  <hr>
  <div class="row"><label>我的语料</label><button id="learn">学习我的推文</button></div>
  <div class="note" id="learnStatus">未学习</div>
  <hr>
  <div class="row"><label>语气</label>
    <select id="tone"><option value="direct">直接判断</option><option value="ask">多问一句</option><option value="add">补充信息</option></select>
  </div>
  <div class="row"><label>长度</label>
    <select id="length"><option value="short">短（≤60 字）</option><option value="mid">中（≤100 字）</option></select>
  </div>
  <div class="stat">今天已填入：<b id="used">0</b> 条</div>
  <div class="row"><button id="reset">清零计数</button><button id="demo">离线试写</button></div>
  <div class="note">Key 只存在这台机器的 chrome.storage.local，不随浏览器账号同步。不自动发送。</div>
  <script src="popup.js"></script>
</body>
</html>
